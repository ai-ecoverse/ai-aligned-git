name: ShellCheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Supersede stale runs: a newer push to the same PR or renovate branch cancels
# the older run; other refs keep at most one pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@2.0.0
      with:
        check_together: 'yes'
        severity: warning  # Check all warning levels
        
    - name: Verify scripts are executable
      run: |
        test -x executable_git || (echo "executable_git is not executable" && exit 1)
        test -x install.sh || (echo "install.sh is not executable" && exit 1)